# Account mapping: country account code -> SHA function + SRHR theme.
#
# This is the PRIMARY classification layer. The account code is the most
# reliable signal available: it is structured, it is assigned by the country's
# own finance system, and it survives the description being blank, mixed-case,
# in French, or carrying injected text. Country C has 27 records with no
# description at all and every one of them still has a coaCode.
#
# Each entry carries an explicit confidence and, where relevant, a review flag.
# Two deliberate outcomes are not SHA HC codes:
#
#   CAPITAL      Gross capital formation. SHA 2011 handles capital under HK,
#                not under the HC functional classification, so forcing these
#                into an HC bucket would overstate current health spending.
#                Kept, labelled, and excluded from HC totals.
#   ADMIN_INPUT  Salaries, fuel, stationery, travel booked as an economic input
#                with no functional purpose attached. Genuinely ambiguous: in
#                SHA these are distributed across functions using allocation
#                keys the extract does not contain. Provisionally HC.7 at low
#                confidence and flagged for review rather than silently counted.
#
# Confidence convention:
#   0.95  purpose unambiguous from the account label
#   0.80  purpose clear, boundary between two HC codes arguable
#   0.40  input-type code, function not determinable from the data

defaults:
  unmapped_confidence: 0.0

